onboarding = false

[ui]
tab_bar_position = "bottom"

[keys]
prefix = "ctrl+g"

# Numbered tab labels are stable shortcuts, even when other tabs are closed.
# Each command switches to the named tab or creates it in the active workspace.
[[keys.command]]
key = "alt+j"
type = "shell"
command = 'powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%APPDATA%\herdr\switch-tab.ps1" 1'
description = "switch to or create tab 1"

